<!--
  FIX #1: Homepage Title Tag Override
  ====================================
  PROBLEM: The Smartarget WhatsApp widget overwrites document.title with a
  notification counter, causing Google to index the homepage title as "(1)"
  instead of the real business name.

  INSTALL: Wix Editor > Settings > Custom Code > Add Custom Code
           - Paste this snippet
           - Place: "Body - end"
           - Pages: "Home" only

  HOW IT WORKS: After the page loads, this script restores the correct title
  and uses a MutationObserver to prevent any widget from changing it again.
-->
<script>
(function() {
  var CORRECT_TITLE = 'Hog Roast & Barbecue Caterer for Weddings, Events & Parties in London | The Gipsy Hill Smokehouse';

  // Restore on load
  document.title = CORRECT_TITLE;

  // Prevent any script from overwriting it
  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      if (document.title !== CORRECT_TITLE) {
        document.title = CORRECT_TITLE;
      }
    });
  });

  var titleEl = document.querySelector('title');
  if (titleEl) {
    observer.observe(titleEl, { childList: true, characterData: true, subtree: true });
  }
})();
</script>
