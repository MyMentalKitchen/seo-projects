        "@type": "Answer",

      }
    },
    {
      "@type": "Question",
      "name": "How far in advance should we book a wedding hog roast?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We recommend booking at least 3 to 6 months before your wedding date, especially for summer weddings (May to September) which are our busiest period. However, we can sometimes accommodate shorter notice bookings depending on availability."
      }

    {
      "@type": "Question",

        "@type": "Answer",

    },
    {

        "@type": "Answer",
